<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="coin" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f4d03f"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </radialGradient>
  </defs>
  
  <!-- Fundo preenche tudo (importante para maskable) -->
  <rect width="512" height="512" fill="#0a0e17"/>
  
  <!-- Moeda maior para ocupar zona segura -->
  <circle cx="256" cy="256" r="230" fill="url(#coin)" stroke="#8b6914" stroke-width="4"/>
  <circle cx="256" cy="256" r="205" fill="none" stroke="#3d2a00" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>
  
  <!-- V centralizado na zona segura -->
  <text x="256" y="320" font-family="Georgia, serif" font-size="260" font-weight="900" 
        fill="#3d2a00" text-anchor="middle">V</text>
</svg>